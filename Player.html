<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyMatch — Ton match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<style>
:root {
  --jaune: #C8FF00;
  --noir: #080808;
  --gris-fonce: #111111;
  --gris-moyen: #1A1A1A;
  --gris-texte: #888888;
  --blanc: #FFFFFF;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--noir);
  color: var(--blanc);
  font-family: 'Barlow Condensed', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 60px;
  background: rgba(10,10,10,0.96);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(200,255,0,0.1);
}
/* Logo wordmark + 3 barres jaunes en cascade (aligné sur index.html) */
.logo { display: flex; align-items: center; gap: 11px; text-decoration: none; transition: opacity .25s ease; }
.logo:hover { opacity: .78; }
.logo-mark { flex-shrink: 0; display: block; }
.logo-mark rect { transition: opacity .25s ease; }
.logo:hover .logo-mark rect:nth-child(2) { opacity: .8; }
.logo:hover .logo-mark rect:nth-child(3) { opacity: .5; }
.logo-t {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 22px;
  letter-spacing: .16em;
  color: var(--blanc);
  line-height: 1;
}
.logo-t span { color: #C8FF00; }
.btn-retour {
  display: flex; align-items: center; gap: 8px;
  background: transparent; border: 1px solid rgba(255,255,255,0.15);
  color: var(--blanc); padding: 8px 16px; border-radius: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 13px; letter-spacing: 0.1em;
  text-transform: uppercase; cursor: pointer; text-decoration: none; transition: all 0.2s;
}
.btn-retour:hover { border-color: var(--jaune); color: var(--jaune); }

/* ── LAYOUT PRINCIPAL ── */
main {
  padding-top: 60px;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: auto 1fr auto;
}

/* ── INFOS MATCH ── */
.match-infos {
  padding: 24px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  grid-column: 1 / -1;
}
.match-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--jaune); margin-bottom: 10px;
}
.match-tag::before {
  content: ''; width: 6px; height: 6px;
  background: var(--jaune); border-radius: 50%; animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}
.match-titre {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: clamp(32px, 6vw, 64px);
  line-height: 0.9; text-transform: uppercase;
  letter-spacing: -0.01em; margin-bottom: 10px;
}
.match-titre .accent { color: var(--jaune); font-style: italic; }
/* Sous-titre jaune fluo italique : style identique au "Matensach"
   d'index.html (.h-darija) */
.match-sub-fluo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(20px, 3.2vw, 34px);
  color: rgba(212,255,0,0.6);
  letter-spacing: 3px;
  text-transform: uppercase;
  font-style: italic;
  margin-bottom: 20px;
}
.match-meta { display: flex; flex-wrap: wrap; gap: 24px; }
.meta-item { display: flex; flex-direction: column; gap: 3px; }
.meta-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--gris-texte);
}
.meta-value {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 17px; color: var(--blanc); letter-spacing: 0.02em;
}

/* ── PLAYER ── */
.player-section { display: flex; flex-direction: column; }
.player-wrapper {
  position: relative; width: 100%; background: #000;
  aspect-ratio: 16/9; overflow: hidden;
}
.player-placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: linear-gradient(135deg, #080808 0%, #111 50%, #080808 100%);
  position: relative;
}
.terrain-grid {
  position: absolute; inset: 0; opacity: 0.04;
  background-image:
    linear-gradient(rgba(200,255,0,0.5) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,255,0,0.5) 1px, transparent 1px);
  background-size: 40px 40px;
}
.terrain-center {
  position: absolute; width: 120px; height: 120px;
  border: 1px solid rgba(200,255,0,0.08); border-radius: 50%;
}
.play-btn {
  position: relative; z-index: 2;
  width: 72px; height: 72px; background: var(--jaune);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; border: none; margin-bottom: 20px;
}
.play-btn:hover { transform: scale(1.08); box-shadow: 0 0 40px rgba(200,255,0,0.3); }
.play-btn svg { width: 28px; height: 28px; fill: var(--noir); margin-left: 4px; }
.placeholder-text { position: relative; z-index: 2; text-align: center; }
.placeholder-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 20px; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--blanc); margin-bottom: 6px;
}
.placeholder-sub { font-size: 13px; color: var(--gris-texte); letter-spacing: 0.05em; }

.player-bar {
  width: 100%; background: rgba(255,255,255,0.04);
  padding: 12px 16px; display: flex; align-items: center; gap: 12px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.progress-track {
  flex: 1; height: 3px; background: rgba(255,255,255,0.1);
  border-radius: 2px; position: relative; cursor: pointer;
}
.progress-fill {
  position: absolute; left: 0; top: 0; height: 100%; width: 0%;
  background: var(--jaune); border-radius: 2px; transition: width 0.1s;
}
.progress-dot {
  position: absolute; top: 50%; left: 0%;
  transform: translate(-50%, -50%);
  width: 12px; height: 12px; background: var(--jaune);
  border-radius: 50%; transition: left 0.1s;
}
.time-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 600; color: var(--gris-texte);
  white-space: nowrap; letter-spacing: 0.05em;
}

/* ── SIDEBAR / ACTIONS ── */
.sidebar { display: flex; flex-direction: column; }
.actions-section { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.btn-primary {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--jaune); color: var(--noir); border: none;
  padding: 16px 24px; font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 16px; letter-spacing: 0.12em;
  text-transform: uppercase; cursor: pointer; border-radius: 3px; transition: all 0.2s;
}
.btn-primary:hover { background: #D6FF1A; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-secondary {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: transparent; color: var(--blanc);
  border: 1px solid rgba(255,255,255,0.15);
  padding: 14px 24px; font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 15px; letter-spacing: 0.1em;
  text-transform: uppercase; cursor: pointer; border-radius: 3px; transition: all 0.2s;
}
.btn-secondary:hover { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.04); }
.btn-whatsapp { border-color: rgba(37,211,102,0.3); color: #25D366; }
.btn-whatsapp:hover { border-color: #25D366; background: rgba(37,211,102,0.06); }
.btn-icon { width: 20px; height: 20px; flex-shrink: 0; }

/* Bandeau fixe collé en bas de l'écran (n'est plus dans le flux
   du contenu — toujours visible quel que soit le scroll). */
.footer-info {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 90;
  padding: 12px 24px;
  margin: 0;
  background: rgba(10,10,10,0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid rgba(200,255,0,0.18);
  display: flex; align-items: center; justify-content: center; gap: 12px;
}
.footer-info-icon { width: 18px; height: 18px; color: var(--jaune); flex-shrink: 0; }
.footer-info-text { font-size: 13px; color: var(--gris-texte); line-height: 1.4; text-align: center; }
.footer-info-text strong { color: var(--blanc); font-weight: 600; }
/* Le divider n'est plus utile maintenant que le bandeau est fixé en bas */
.divider { display: none; }
/* Réserve de l'espace en bas du body pour que le contenu ne soit
   pas masqué par le bandeau fixe (≈ 60px de hauteur) */
body { padding-bottom: 60px; }

/* ── ANIMATIONS ── */
.fade-in { opacity: 0; transform: translateY(16px); animation: fadeIn 0.5s ease forwards; }
.fade-in:nth-child(1) { animation-delay: 0.1s; }
.fade-in:nth-child(2) { animation-delay: 0.2s; }
.fade-in:nth-child(3) { animation-delay: 0.3s; }
@keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

/* ── TABLETTE 768px+ ── */
@media(min-width:768px){
  main {
    grid-template-columns: 1fr 320px;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "infos infos"
      "player sidebar";
  }
  .match-infos {
    grid-area: infos;
    padding: 32px 40px 28px;
  }
  .match-titre { font-size: clamp(40px, 5vw, 64px); }
  .player-section {
    grid-area: player;
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .player-wrapper { aspect-ratio: 16/9; }
  .player-bar { padding: 14px 24px; }
  .sidebar {
    grid-area: sidebar;
    border-left: none;
  }
  .actions-section { padding: 28px 24px; }
  /* .footer-info reste fixed bottom — pas de margin */
}

/* ── DESKTOP 1100px+ ── */
@media(min-width:1100px){
  header { padding: 0 48px; }
  main {
    grid-template-columns: 1fr 380px;
    grid-template-areas:
      "infos infos"
      "player sidebar";
  }
  .match-infos { padding: 40px 56px 32px; }
  .match-titre { font-size: clamp(48px, 5vw, 72px); }
  .match-meta { gap: 40px; }
  .meta-value { font-size: 20px; }
  .player-bar { padding: 16px 32px; }
  .actions-section { padding: 36px 32px; }
  /* .footer-info reste fixed bottom — pas de margin */
  .btn-primary { font-size: 17px; padding: 18px 28px; }
  .btn-secondary { font-size: 15px; padding: 15px 28px; }
}

/* ── GRAND ÉCRAN 1400px+ ── */
@media(min-width:1400px){
  main { grid-template-columns: 1fr 420px; }
  .match-infos { padding: 48px 72px 36px; }
  .player-bar { padding: 18px 40px; }
}

/* ── PLEIN ÉCRAN ── */
.player-wrapper:-webkit-full-screen { width: 100%; height: 100%; }
.player-wrapper:fullscreen { width: 100%; height: 100%; }

/* Rideau d'entrée cinématique : présent au chargement (page noire +
   wordmark MyMatch) puis se rétracte vers le haut pour révéler la
   page. Côté pair avec la transition de sortie de index.html. */
.enter-curtain{
  position: fixed; inset: 0; z-index: 9999;
  background: var(--noir);
  display: flex; align-items: center; justify-content: center;
  transform: translateY(0);
  transition: transform .8s cubic-bezier(.85,0,.15,1) .2s;
}
.enter-curtain.is-done{ transform: translateY(-100%); pointer-events: none; }
.ec-mark{ display: flex; align-items: center; gap: 14px; opacity: 1; transition: opacity .35s ease; }
.enter-curtain.is-done .ec-mark{ opacity: 0; }
.ec-mark span{
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 34px;
  letter-spacing: .18em; color: var(--blanc); line-height: 1;
}
.ec-mark span .ac{ color: var(--jaune); }

@media (prefers-reduced-motion: reduce){
  .enter-curtain{ transition: none; }
}
</style>
</head>
<body>

<!-- Rideau cinématique d'entrée : retiré par JS au load -->
<div class="enter-curtain" id="enterCurtain">
  <div class="ec-mark">
    <svg width="22" height="24" viewBox="0 0 20 22" fill="none" aria-hidden="true">
      <rect x="0" y="0" width="4" height="22" fill="#C8FF00"/>
      <rect x="8" y="0" width="4" height="22" fill="#C8FF00" opacity=".55"/>
      <rect x="16" y="0" width="4" height="22" fill="#C8FF00" opacity=".22"/>
    </svg>
    <span>MY<span class="ac">MATCH</span></span>
  </div>
</div>

<header>
  <a href="index.html" class="logo" aria-label="MyMatch">
    <svg class="logo-mark" width="20" height="22" viewBox="0 0 20 22" fill="none" aria-hidden="true">
      <rect x="0" y="0" width="4" height="22" fill="#C8FF00"/>
      <rect x="8" y="0" width="4" height="22" fill="#C8FF00" opacity=".55"/>
      <rect x="16" y="0" width="4" height="22" fill="#C8FF00" opacity=".22"/>
    </svg>
    <span class="logo-t">MY<span>MATCH</span></span>
  </a>
  <a href="index.html" class="btn-retour">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M19 12H5M5 12L12 19M5 12L12 5"/>
    </svg>
    Retour
  </a>
</header>

<main>

  <div class="match-infos">
    <h1 class="match-titre fade-in">TON MATCH.<br>TA VIDÉO.</h1>
    <div class="match-sub-fluo fade-in">Disponible maintenant.</div>
    <div class="match-meta fade-in">
      <div class="meta-item">
        <span class="meta-label">Club</span>
        <span class="meta-value" id="meta-club">City Foot 5</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Terrain</span>
        <span class="meta-value" id="meta-terrain">Terrain 3</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Date</span>
        <span class="meta-value" id="meta-date">Sam 9 mai</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Heure</span>
        <span class="meta-value" id="meta-heure">21:00</span>
      </div>
    </div>
  </div>

  <div class="player-section">
    <div class="player-wrapper" id="playerWrapper">
      <div class="player-placeholder" id="playerPlaceholder">
        <div class="terrain-grid"></div>
        <div class="terrain-center"></div>
        <button class="play-btn" onclick="simulatePlay()" aria-label="Lire la vidéo">
          <svg viewBox="0 0 24 24"><path d="M5 3L19 12L5 21V3Z"/></svg>
        </button>
        <div class="placeholder-text">
          <div class="placeholder-title">Chargement…</div>
          <div class="placeholder-sub">Récupération de ta vidéo</div>
        </div>
      </div>
      <video id="videoPlayer" style="display:none;position:absolute;inset:0;width:100%;height:100%;background:#000" controls playsinline></video>
      <div id="videoError" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:var(--noir);font-family:'Barlow Condensed',sans-serif;font-size:18px;letter-spacing:.08em;color:var(--gris-texte);text-align:center;padding:24px"></div>
    </div>
    <div class="player-bar">
      <span class="time-label">00:00</span>
      <div class="progress-track" onclick="seekVideo(event)">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-dot" id="progressDot"></div>
      </div>
      <span class="time-label">60:00</span>
      <button onclick="toggleFullscreen()" style="background:none;border:none;cursor:pointer;color:var(--gris-texte);padding:4px;flex-shrink:0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="sidebar">
    <div class="actions-section">
      <button class="btn-primary" onclick="telecharger()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
        Télécharger la vidéo
      </button>
      <button class="btn-secondary btn-whatsapp" onclick="partagerWhatsApp()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
          <path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.553 4.116 1.518 5.844L.057 23.272a.5.5 0 00.609.627l5.557-1.457A11.944 11.944 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.943 0-3.764-.528-5.321-1.444l-.38-.224-3.938 1.032 1.054-3.834-.247-.395A9.957 9.957 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
        </svg>
        Partager sur WhatsApp
      </button>
    </div>
  </div>

</main>

<!-- Bandeau d'information fixe en bas de l'écran -->
<div class="footer-info">
  <svg class="footer-info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" y1="8" x2="12" y2="12"/>
    <line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>
  <p class="footer-info-text">
    <strong>Vos vidéos sont disponibles pendant 14 jours</strong> après la date du match, puis supprimées automatiquement.
  </p>
</div>

<script>
function getParams() {
  const params = new URLSearchParams(window.location.search);
  return {
    club:    params.get('club')    || 'City Foot 5',
    terrain: params.get('terrain') || 'Terrain 3',
    date:    params.get('date')    || '',
    heure:   params.get('heure')   || '21:00'
  };
}

function formatDateNice(dateStr) {
  const jours = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const mois  = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  return jours[d.getDay()] + ' ' + d.getDate() + ' ' + mois[d.getMonth()];
}

const p = getParams();
document.getElementById('meta-club').textContent    = p.club;
document.getElementById('meta-terrain').textContent = p.terrain;
document.getElementById('meta-date').textContent    = p.date ? formatDateNice(p.date) : '—';
document.getElementById('meta-heure').textContent   = p.heure;
document.title = 'MyMatch — ' + p.club + ' · ' + p.terrain;

const clubSlugs = {
  'City Foot 5':     'city-foot-5',
  'Arena Bouskoura': 'arena-bouskoura',
  'Green Sports Park':'green-sports-park'
};

async function fetchVideo() {
  const clubSlug    = clubSlugs[p.club] || p.club.toLowerCase().replace(/\s+/g,'-');
  const terrainSlug = p.terrain.toLowerCase().replace(/\s+/g,'-');
  const heure       = decodeURIComponent(p.heure);
  const url = 'https://mymatch.ma/api/video'
    + '?club='    + clubSlug
    + '&terrain=' + terrainSlug
    + '&date='    + p.date
    + '&heure='   + heure;
  console.log('[MyMatch] fetchVideo →', url);
  try {
    const res  = await fetch(url);
    const data = await res.json();
    console.log('[MyMatch] réponse API video →', data);
    if (!res.ok || !data || data.error || !data.url) {
      showVideoError('Vidéo non disponible ou expirée.');
      return;
    }
    loadVideo(data.url);
  } catch(e) {
    console.error('[MyMatch] erreur fetchVideo:', e);
    showVideoError('Vidéo non disponible ou expirée.');
  }
}

function loadVideo(videoUrl) {
  const placeholder = document.getElementById('playerPlaceholder');
  const videoEl     = document.getElementById('videoPlayer');
  if (placeholder) placeholder.style.display = 'none';
  videoEl.src = videoUrl;
  videoEl.style.display = 'block';
  videoEl.load();
}

function showVideoError(msg) {
  const placeholder = document.getElementById('playerPlaceholder');
  const errEl       = document.getElementById('videoError');
  if (placeholder) placeholder.style.display = 'none';
  errEl.textContent  = msg;
  errEl.style.display = 'flex';
}

fetchVideo();

let isPlaying = false, progress = 0, interval;

function simulatePlay() {
  isPlaying = !isPlaying;
  const btn = document.querySelector('.play-btn svg');
  if (isPlaying) {
    btn.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="#080808"/><rect x="14" y="4" width="4" height="16" fill="#080808"/>';
    interval = setInterval(() => {
      progress = Math.min(progress + 0.037, 100);
      document.getElementById('progressFill').style.width = progress + '%';
      document.getElementById('progressDot').style.left  = progress + '%';
      if (progress >= 100) { clearInterval(interval); isPlaying = false; }
    }, 1000);
  } else {
    btn.innerHTML = '<path d="M5 3L19 12L5 21V3Z"/>';
    clearInterval(interval);
  }
}

function seekVideo(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  progress = ((e.clientX - rect.left) / rect.width) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('progressDot').style.left  = progress + '%';
}

function toggleFullscreen() {
  const w = document.getElementById('playerWrapper');
  if (!document.fullscreenElement) {
    w.requestFullscreen?.() || w.webkitRequestFullscreen?.();
  } else {
    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
  }
}

function telecharger() {

}

screen.orientation?.addEventListener('change', () => {
  if (screen.orientation.type.includes('landscape')) {
    document.getElementById('playerWrapper').requestFullscreen?.();
  }
});

/* Retire le rideau d'entrée une fois la page chargée. */
(function(){
  const curtain = document.getElementById('enterCurtain');
  if (!curtain) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    curtain.remove(); return;
  }
  window.addEventListener('load', function(){
    setTimeout(function(){ curtain.classList.add('is-done'); }, 60);
    setTimeout(function(){ curtain.remove(); }, 1200);
  });
})();
</script>
